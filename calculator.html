<html>
    <head>
        <title>calci</title>
        <style>
            h1{
                text-align: center;
                color: chartreuse;
                margin-top: 350px;
                font-size: 100px;
                border-radius: 20px;
                box-shadow: 2px 4px 8px black;
            }
        </style>

    </head>
    <body>
        <h1>CALCULATOR</h1>
        <script>
             let a=Number(prompt("enter first number"));
             let b=Number(prompt("enter second number"))
            function add(){
                
                document.write("sum of :"+(a+b)+"<br>")

            }
            add()
            function sub(){
                document.write(("difference is:"+(a-b)+"<br>"))
            }
            sub()
            function mul(){
                document.write(("difference is:"+(a*b)+"<br>"))
            }
            mul()
            let div=()=>{
                return a/b;
            }
            document.write("after division is:"+div())
            let mod=()=>{
                return a%b;
            }
            document.write("after mod:"+mod())


            


            
        </script>
    </body>
</html>
