<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Simple Chess Board</title>
	<style>

		*{
			box-sizing: border-box;
		}s

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: linear-gradient(160deg, #4e3624, #2a1b12);
			font-family: Arial, Helvetica, sans-serif;
		}

		.wrap {
			width: min(92vmin, 760px);
			padding: 18px;
			background: #5b3d25;
			border: 10px solid #7a522f;
			box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
		}

		.board {
			display: grid;
			grid-template-columns: repeat(8, 1fr);
			width: 100%;
			aspect-ratio: 1 / 1;
			border: 4px solid #3a2516;
			background: #000;
		}

		.square {
			display: grid;
			place-items: center;
			font-size: clamp(1.6rem, 4vmin, 3rem);
			aspect-ratio: 1 / 1;
			user-select: none;
		}

		.light {
			background: #e8c89a;
		}

		.dark {
			background: #8b5e34;
		}

		.piece-white {
			color: #fff8ee;
			text-shadow: 0 2px 3px rgba(0, 0, 0, 0.55);
		}

		.piece-black {
			color: #22150d;
			text-shadow: 0 1px 1px rgba(255, 255, 255, 0.25);
		}
	</style>
</head>
<body>
	<div class="wrap">
		<div class="board" aria-label="Chess board">
			<div class="square dark piece-black">♜</div>
			<div class="square light piece-black">♞</div>
			<div class="square dark piece-black">♝</div>
			<div class="square light piece-black">♛</div>
			<div class="square dark piece-black">♚</div>
			<div class="square light piece-black">♝</div>
			<div class="square dark piece-black">♞</div>
			<div class="square light piece-black">♜</div>

			<div class="square light piece-black">♟</div>
			<div class="square dark piece-black">♟</div>
			<div class="square light piece-black">♟</div>
			<div class="square dark piece-black">♟</div>
			<div class="square light piece-black">♟</div>
			<div class="square dark piece-black">♟</div>
			<div class="square light piece-black">♟</div>
			<div class="square dark piece-black">♟</div>

			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>

			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>

			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>

			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>
			<div class="square light"></div>
			<div class="square dark"></div>

			<div class="square dark piece-white">♙</div>
			<div class="square light piece-white">♙</div>
			<div class="square dark piece-white">♙</div>
			<div class="square light piece-white">♙</div>
			<div class="square dark piece-white">♙</div>
			<div class="square light piece-white">♙</div>
			<div class="square dark piece-white">♙</div>
			<div class="square light piece-white">♙</div>

			<div class="square light piece-white">♖</div>
			<div class="square dark piece-white">♘</div>
			<div class="square light piece-white">♗</div>
			<div class="square dark piece-white">♕</div>
			<div class="square light piece-white">♔</div>
			<div class="square dark piece-white">♗</div>
			<div class="square light piece-white">♘</div>
			<div class="square dark piece-white">♖</div>
		</div>
	</div>
</body>
</html>
